apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wordpress-helm-deployer
  namespace: wordpress
rules:
  - apiGroups: [""]
    resources: [configmaps, persistentvolumeclaims, secrets, serviceaccounts, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [secrets-store.csi.x-k8s.io]
    resources: [secretproviderclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events, pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wordpress-helm-deployer
  namespace: wordpress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wordpress-helm-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: 0a242614-6a4e-40c3-b1df-b981e73beb40
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wordpress-helm-uploads-storageclass
rules:
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [wordpress-uploads]
    verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wordpress-helm-uploads-storageclass
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wordpress-helm-uploads-storageclass
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: 0a242614-6a4e-40c3-b1df-b981e73beb40
