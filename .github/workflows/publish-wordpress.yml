name: Publish and deploy WordPress

on:
  push:
    branches: [main]

concurrency:
  group: wordpress-aks-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_NAME: wordpress
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: |
          docker build --platform linux/amd64 \
            --tag "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG" .

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241
        with:
          version: v0.76.2

      - name: Generate the vulnerability report
        run: |
          trivy image --image-src docker --scanners vuln \
            --format json --output trivy-report.json \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Save the vulnerability report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json

      - name: Block fixable High and Critical vulnerabilities
        run: |
          trivy image --image-src docker --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG"

      - name: Sign in to Azure through OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push and lock the image
        id: publish_image
        run: |
          registry_name="${ACR_LOGIN_SERVER%%.*}"
          image_tag="$IMAGE_NAME:$IMAGE_TAG"

          az acr login --name "$registry_name"
          docker push "$ACR_LOGIN_SERVER/$image_tag"

          az acr repository update --name "$registry_name" \
            --image "$image_tag" \
            --write-enabled false --delete-enabled false --output none

          digest="$(az acr repository show --name "$registry_name" \
            --image "$image_tag" --query digest --output tsv)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::ACR did not return a valid image digest."
            exit 1
          fi

          image="$ACR_LOGIN_SERVER/$IMAGE_NAME@$digest"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Published image: %s\n' "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Install kubectl, kubelogin, and Helm
        run: |
          tools_dir="$RUNNER_TEMP/wordpress-tools"
          mkdir -p "$tools_dir"

          az aks install-cli \
            --client-version 1.36.5 \
            --install-location "$tools_dir/kubectl" \
            --kubelogin-version 0.2.21 \
            --kubelogin-install-location "$tools_dir/kubelogin"

          helm_archive="$tools_dir/helm-v4.2.1-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://get.helm.sh/helm-v4.2.1-linux-amd64.tar.gz \
            --output "$helm_archive"
          printf '%s  %s\n' \
            479dca836e5b45e8bd222400c5591b0e3a647378f03ff96597180db97c17fdae \
            "$helm_archive" | sha256sum --check
          tar -xzf "$helm_archive" -C "$tools_dir" linux-amd64/helm
          mv "$tools_dir/linux-amd64/helm" "$tools_dir/helm"
          printf '%s\n' "$tools_dir" >> "$GITHUB_PATH"

      - name: Deploy the published image through Helm
        env:
          PUBLISHED_IMAGE: ${{ steps.publish_image.outputs.image }}
          KUBECONFIG: ${{ runner.temp }}/wordpress-kubeconfig
        run: |
          az aks get-credentials \
            --resource-group rg-k8s-lab --name aks-k8s-lab \
            --file "$KUBECONFIG" --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

          helm upgrade wordpress deploy/helm/wordpress \
            --namespace wordpress \
            --values deploy/helm/wordpress/values-aks.yaml \
            --set-string "image=$PUBLISHED_IMAGE" \
            --wait=legacy --rollback-on-failure --timeout 5m

          kubectl -n wordpress rollout status deployment/wordpress --timeout=120s
          deployed_image="$(kubectl -n wordpress get deployment wordpress \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="wordpress")].image}')"
          if [[ "$deployed_image" != "$PUBLISHED_IMAGE" ]]; then
            echo "::error::The deployed image does not match the published digest."
            exit 1
          fi
          printf 'Deployed image: %s\n' "$deployed_image" >> "$GITHUB_STEP_SUMMARY"
